# Temporary provisioning build only.
#
# The production/default firmware keeps the UART read-only. This overlay enables
# a serial shell with the app-specific `tracker provision` command so LoRaWAN
# identity settings can be written to NVS without compiling credentials into
# the image.

CONFIG_TRACKER_PROVISIONING_MODE=y

CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_CMD_BUFF_SIZE=160
CONFIG_SHELL_ECHO_STATUS=n
CONFIG_SHELL_HISTORY=n

# Avoid competing UART log and shell backends in the provisioning build.
CONFIG_LOG_BACKEND_UART=n
CONFIG_SHELL_LOG_BACKEND=y

CONFIG_LOG=y
# Keep UART read-only; shell RX echo can turn line noise into console garbage.
CONFIG_LOG_BACKEND_UART=y
CONFIG_LED_STATUS=y

CONFIG_EARLY_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y

CONFIG_INIT_STACKS=y
CONFIG_MAIN_STACK_SIZE=5200
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_ISR_STACK_SIZE=4096

CONFIG_WATCHDOG=y
CONFIG_TASK_WDT=y

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_RUNTIME=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y

CONFIG_GNSS=y
CONFIG_APP_GNSS_LOG_LEVEL_DBG=y

CONFIG_LORA=y
CONFIG_LORAWAN=y
CONFIG_LORAWAN_REGION_EU868=y
CONFIG_LORAWAN_LOG_LEVEL_DBG=y
CONFIG_APP_LORAWAN_NODE_LOG_LEVEL_DBG=y

